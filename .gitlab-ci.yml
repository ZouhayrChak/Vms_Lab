run_backend:
  image: eclipse-temurin:17-jdk
  before_script:
    - cd Backend/
    - apt update && apt install -y curl
  script:
    - ./mvnw clean package -DskipTests
    - java -jar target/backend-0.0.1-SNAPSHOT.jar &
  after_script:
    - curl -X POST http://localhost:8080/api/auth/user


run_frontend:
  image: node:16
  before_script:
    - cd Frontend/
  script:
    - npm install
    - npm run build
    - npm install -g serve
    - serve -s build -l 5000 &
  after_script:
    - curl -X GET http://localhost:5000




