version: "3.8"

services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - data:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./Backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lab
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_SHOW_SQL: "true"
      FLASK_URL: "http://host.docker.internal:8000"
    networks:
      - backend
      - frontend
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./Frontend
    networks:
      - backend
      - frontend
    environment:
      VITE_API: http://backend:8080
      VITE_SOCKET: "http://host.docker.internal:5000"
    ports:
      - "80:80"
    volumes:
      - ./Frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  backend:
  frontend:

volumes:
  data:
