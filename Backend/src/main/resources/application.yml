server:
  error:
    include-message: always
    include-binding-errors: always

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/lab
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

security:
  jwt:
    secret-key: mysupermegasecretkeythatismorethan32chars
    expiration-time: 360000000000

logging:
  level:
    org:
      springframework:
        security: DEBUG

flask:
  url: "127.0.0.1:8080/api"

